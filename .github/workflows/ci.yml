name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push to the same PR makes the first run's answer irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"

jobs:
  # Ordered cheap to expensive, as separate jobs with explicit `needs`. A formatting
  # mistake is reported in well under a minute and never waits behind a build; nothing
  # slow starts until the fast checks have already passed.
  format-and-lint:
    name: 1. format + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json
      - name: Install tooling
        run: npm ci
      - name: Check formatting
        run: npm run format:check
      - name: Lint (includes architecture boundary rules)
        run: npm run lint

  typecheck:
    name: 2. typecheck
    runs-on: ubuntu-latest
    needs: format-and-lint
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - run: npm ci --prefix backend
      - run: npm ci --prefix frontend
      - run: npm run typecheck --prefix backend
      - run: npm run typecheck --prefix frontend

  test-unit:
    name: 3. unit tests
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - run: npm ci --prefix backend
      - run: npm ci --prefix frontend
      # The inner rings touch no socket, so this tier needs no services and finishes
      # in seconds. tests/setup/env.ts supplies the environment config/env.ts demands.
      - run: npm run test:unit --prefix backend
      # The frontend's mirror image: lib/ is pure, so it runs in the same node process
      # with no DOM and no browser. Anything needing a rendered component would belong
      # in a new tier, not bolted onto this one.
      - run: npm run test --prefix frontend

  test-integration:
    name: 4. integration tests
    runs-on: ubuntu-latest
    needs: test-unit
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --prefix backend
      # Boots the real Express app over real HTTP. The cases are chosen to be answerable
      # without Postgres or Redis; when a case needs them, add the services: block here
      # rather than weakening the test.
      - run: npm run test:integration --prefix backend

  build:
    name: 5. build
    runs-on: ubuntu-latest
    needs: test-integration
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - run: npm ci --prefix backend
      - run: npm ci --prefix frontend
      - run: npm run build --prefix backend
      - run: npm run build --prefix frontend

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    # Independent of the pipeline above: a newly disclosed CVE in an unchanged dependency
    # should not block a PR that has nothing to do with it, but it should be visible.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm audit --audit-level=high --prefix backend
      - run: npm audit --audit-level=high --prefix frontend
