services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: watchlist
      POSTGRES_PASSWORD: watchlist
      POSTGRES_DB: watchlist
    ports:
      - "5432:5432"
    volumes:
      - watchlist_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U watchlist"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  watchlist_pg_data:
